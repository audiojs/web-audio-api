name: W3C WPT

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  wpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run wpt

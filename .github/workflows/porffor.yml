# Tracking job: Porffor cannot run the engine yet. Unbundled it lacks
# import-declaration codegen; fully bundled (all deps stubbed or inlined,
# zero imports) its wasm codegen miscompiles ("expected 2 elements on the
# stack for branch", verified on 0.61.13). Weekly, so progress is noticed.
name: Porffor

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: printf 'export default null\nexport const from = null\n' > stub.js
      - run: npx esbuild test/smoke.mjs --bundle --format=esm --outfile=smoke-porf.mjs --alias:@audio/decode=./stub.js --alias:@audio/decode-ape=./stub.js --alias:@audio/speaker=./stub.js --alias:@audio/mic=./stub.js
      - run: npx -y porffor@latest --module smoke-porf.mjs

# Tracking job: Porffor cannot compile import declarations yet
# ("no generation for ImportDeclaration", verified on 0.61.13), so this
# fails honestly until Porffor lands ESM support. Weekly, not per push.
name: Porffor

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y porffor@latest --module test/smoke.mjs
